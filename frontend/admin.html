<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceHR Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #1f293d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
    .container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
    label { display: block; margin: 1.25rem 0 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
    input, select { width: 100%; padding: 0.75rem 1rem; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: 0.85rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 1rem; margin-top: 1.75rem; }
    button:hover { background: var(--primary-hover); }
    .result-box { margin-top: 1.5rem; padding: 1rem; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; word-break: break-all; font-size: 0.9rem; }
    .copy-btn { background: #1e293b; color: white; border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-top: 0.75rem; width: auto; }
    .copy-btn:hover { background: #334155; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Interview Link</h1>
    <p class="subtitle">Generate an automated language assessment link valid for 7 days.</p>
    
    <form id="invite-form">
      <label for="candidate-name">Candidate Full Name</label>
      <input id="candidate-name" name="candidate_name" placeholder="e.g. Jane Doe" required>
      
      <label for="candidate-email">Candidate Email</label>
      <input id="candidate-email" name="candidate_email" type="email" placeholder="jane@example.com" required>
      
      <label for="language">Target Assessment Language</label>
      <select id="language" name="language">
        <option value="en">English (EN)</option>
        <option value="fr">French (FR)</option>
      </select>
      
      <button type="submit">Generate Link</button>
    </form>

    <div id="result" class="result-box" hidden>
      <div style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.35rem;">Candidate Link Generated:</div>
      <div id="link-text" style="font-weight: 600; color: #93c5fd;"></div>
      <button id="copy-btn" class="copy-btn">Copy Link</button>
    </div>
  </div>

  <script>
    const form = document.querySelector('#invite-form');
    const result = document.querySelector('#result');
    const linkText = document.querySelector('#link-text');
    const copyBtn = document.querySelector('#copy-btn');
    let generatedUrl = "";

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const response = await fetch('/api/invite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const data = await response.json();
      result.hidden = false;
      if (response.ok) {
        generatedUrl = new URL(data.interview_url, location.origin).href;
        linkText.textContent = generatedUrl;
      } else {
        linkText.textContent = data.detail || 'Unable to create link';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(generatedUrl);
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = "Copy Link", 2000);
    });
  </script>
</body>
</html>
